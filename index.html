<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PV ACADEMY | VIP SYSTEM</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root { 
            --bg: #01040a; 
            --accent: #00f2ff; 
            --gold: #ffcc00; 
            --locked-red: #ff3131; 
            --card-bg: rgba(10, 20, 30, 0.95);
            --input-focus: #00f2ff33;
        }

        body, html { margin: 0; padding: 0; min-height: 100vh; background: var(--bg); font-family: 'Rajdhani', sans-serif; color: white; display: flex; justify-content: center; align-items: center; }

        .container { 
            width: 90%; max-width: 450px; background: var(--card-bg); padding: 30px; 
            border-radius: 30px; border: 1px solid rgba(0, 242, 255, 0.2); 
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.1); text-align: center; display: none;
        }

        h2 { font-family: 'Orbitron', sans-serif; color: var(--accent); letter-spacing: 2px; margin-bottom: 25px; text-transform: uppercase; font-size: 1.4rem; }

        /* Inputs */
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; margin-bottom: 5px; font-size: 12px; color: #888; margin-left: 10px; }
        .input-box { 
            width: 100%; padding: 15px; background: rgba(255,255,255,0.03); 
            border: 1px solid #333; border-radius: 12px; color: white; outline: none; 
            box-sizing: border-box; font-size: 16px; transition: 0.3s; font-family: 'Share Tech Mono';
        }
        .input-box:focus { border-color: var(--accent); background: var(--input-focus); }

        /* Buttons */
        .btn { 
            width: 100%; padding: 16px; border-radius: 12px; border: none; 
            font-family: 'Orbitron'; font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn-main { background: var(--accent); color: black; box-shadow: 0 4px 15px rgba(0, 242, 255, 0.3); }
        .btn-main:hover { background: #00d4e0; transform: translateY(-2px); }
        .btn-main:active { transform: translateY(0); }

        .btn-logout { background: transparent; color: #ff4444; border: 1px solid #ff4444; margin-top: 20px; font-size: 11px; padding: 10px; }

        /* Signals */
        .signal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 20px 0; }
        .sig-card { 
            background: rgba(255,255,255,0.03); padding: 15px; border-radius: 15px; 
            border: 1px solid #222; position: relative; overflow: hidden;
        }
        .sig-time { color: var(--gold); font-size: 14px; font-weight: bold; }
        .digi-odds { font-size: 24px; font-family: 'Share Tech Mono'; margin-top: 5px; }
        
        /* Device Lock UI */
        .device-box { background: #1a0505; border: 1px solid var(--locked-red); padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        #display-device-id { font-family: 'Share Tech Mono'; color: var(--locked-red); font-size: 1.1rem; }

        #toast { position: fixed; bottom: 30px; background: var(--accent); color: #000; padding: 10px 25px; border-radius: 30px; font-weight: bold; display: none; }
    </style>
</head>
<body>

<div id="auth-screen" class="container">
    <h2>PV ACADEMY</h2>
    <div class="input-group">
        <label>EMAIL ADDRESS</label>
        <input type="email" id="email" class="input-box" placeholder="example@mail.com">
    </div>
    <div class="input-group">
        <label>PASSWORD</label>
        <input type="password" id="pass" class="input-box" placeholder="******">
    </div>
    <div class="input-group">
        <label>AVIATOR GAME ID</label>
        <input type="text" id="gameid" class="input-box" placeholder="Enter ID">
    </div>
    <div class="input-group">
        <label>PROMO CODE (OPTIONAL)</label>
        <input type="text" id="promocode" class="input-box" placeholder="PROMO CODE" style="color: var(--gold);">
    </div>
    <button class="btn btn-main" onclick="handleLogin()">REGISTER SYSTEM</button>
</div>

<div id="lock-screen" class="container">
    <h2 style="color: var(--locked-red);">ACCESS DENIED</h2>
    <p style="color: #888; font-size: 13px;">Send this ID to Admin to unlock your device.</p>
    <div class="device-box">
        <div id="display-device-id">PV-WAITING...</div>
        <button onclick="copyDeviceID()" style="background: none; border: none; color: white; cursor: pointer; text-decoration: underline; font-size: 11px; margin-top: 5px;">COPY ID</button>
    </div>
    <input type="text" id="unlock-input" class="input-box" placeholder="ENTER UNLOCK CODE">
    <button class="btn btn-main" style="background:var(--locked-red); color: white;" onclick="handleUnlock()">ACTIVATE ACCESS</button>
    <button class="btn btn-logout" onclick="logout()">LOGOUT & RESET</button>
</div>

<div id="dashboard" class="container">
    <h2>VIP DASHBOARD</h2>
    <div class="input-group">
        <label>ENTER PEAK VALUE</label>
        <input type="number" id="peak-input" class="input-box" placeholder="e.g. 1.50">
    </div>
    <div class="signal-grid">
        <div class="sig-card"><div id="t1" class="sig-time">--:--</div><div id="o1" class="digi-odds">0.00x</div></div>
        <div class="sig-card"><div id="t2" class="sig-time">--:--</div><div id="o2" class="digi-odds">0.00x</div></div>
        <div class="sig-card"><div id="t3" class="sig-time">--:--</div><div id="o3" class="digi-odds">0.00x</div></div>
        <div class="sig-card"><div id="t4" class="sig-time">--:--</div><div id="o4" class="digi-odds">0.00x</div></div>
    </div>
    <button class="btn btn-main" id="scan-btn" onclick="runAIScan()">GENERATE SIGNALS</button>
    <button class="btn btn-logout" onclick="logout()" style="border-color: #333; color: #888;">LOGOUT SYSTEM</button>
</div>

<div id="toast">COPIED!</div>

<script>
    // --- FIREBASE CONFIG ---
    const firebaseConfig = {
        apiKey: "AIzaSyCDIN28pUgBmYqScLzuf7dJNpbE0JDU-TE",
        authDomain: "prakash-academy-8a60d.firebaseapp.com",
        projectId: "prakash-academy-8a60d",
        storageBucket: "prakash-academy-8a60d.firebasestorage.app",
        messagingSenderId: "13529868262",
        appId: "1:13529868262:web:4e2c17fc10e9189c085827",
        databaseURL: "https://prakash-academy-8a60d-default-rtdb.firebaseio.com/"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    window.onload = function() {
        const savedId = localStorage.getItem("pv_user_id");
        const isUnlocked = localStorage.getItem("pv_unlocked");

        if (isUnlocked === "true") showDashboard();
        else if (savedId) showLockScreen(savedId);
        else document.getElementById("auth-screen").style.display = "block";
    };

    function handleLogin() {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('pass').value;
        const gid = document.getElementById('gameid').value;
        const promo = document.getElementById('promocode').value || "NO PROMO";

        if(!email || !pass || !gid) return alert("Fill all required fields!");

        const devId = "PV-" + Math.floor(1000 + Math.random() * 9000) + "-" + Math.random().toString(36).substr(2, 4).toUpperCase();
        
        const userData = {
            email, password: pass, gameId: gid, promo,
            deviceId: devId, unlockCode: "PENDING"
        };

        database.ref('users/' + devId).set(userData).then(() => {
            localStorage.setItem("pv_user_id", devId);
            showLockScreen(devId);
        });
    }

    function handleUnlock() {
        const input = document.getElementById('unlock-input').value;
        const devId = localStorage.getItem("pv_user_id");

        database.ref('users/' + devId).once('value').then(snap => {
            const data = snap.val();
            if(data && input === data.unlockCode && data.unlockCode !== "PENDING") {
                localStorage.setItem("pv_unlocked", "true");
                showDashboard();
            } else {
                alert("Invalid Unlock Code!");
            }
        });
    }

    function runAIScan() {
        const peak = document.getElementById('peak-input').value;
        if(!peak) return alert("Enter Peak Value First!");

        const btn = document.getElementById('scan-btn');
        btn.innerText = "SCANNING DATABASE...";
        btn.disabled = true;

        setTimeout(() => {
            for(let i=1; i<=4; i++) {
                const now = new Date();
                now.setMinutes(now.getMinutes() + (i * 2) + Math.floor(Math.random() * 5));
                const timeStr = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
                const odds = (parseFloat(peak) + (Math.random() * 2)).toFixed(2);
                
                document.getElementById(`t${i}`).innerText = timeStr;
                document.getElementById(`o${i}`).innerText = odds + "x";
            }
            btn.innerText = "GENERATE SIGNALS";
            btn.disabled = false;
        }, 2000);
    }

    function showDashboard() { hideAll(); document.getElementById("dashboard").style.display = "block"; }
    function showLockScreen(id) { hideAll(); document.getElementById("display-device-id").innerText = id; document.getElementById("lock-screen").style.display = "block"; }
    function hideAll() { document.querySelectorAll('.container').forEach(c => c.style.display = 'none'); }
    function logout() { localStorage.clear(); location.reload(); }
    function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2000); }
    function copyDeviceID() { navigator.clipboard.writeText(document.getElementById("display-device-id").innerText); showToast("ID COPIED!"); }
</script>
</body>
</html>
